<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Previa · Unirme a una sala</title>
<link rel="stylesheet" href="style.css">
<style>.jw{max-width:420px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px;text-align:center}
.jw input{text-align:center;font-size:34px;letter-spacing:8px;font-weight:900;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace}</style>
</head><body><div id="app" style="overflow:auto">
<div class="jw">
  <div class="logo big">PRE<span>VIA</span></div>
  <div class="panel"><div style="font-size:44px">🌍</div><h3 id="t1">Unirme a una sala</h3>
    <p class="hint" id="t2">Escribe el código que te han pasado.</p>
    <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="KX7P2"></div>
  <button class="btn primary" id="go">Entrar</button>
</div></div>
<script>
const L=(/[?&]lang=(es|en|fr)/.exec(location.search)||[])[1]||((navigator.language||"es").slice(0,2));
const T={en:["Join a room","Type the code you were given.","Join"],fr:["Rejoindre une salle","Écris le code qu'on t'a donné.","Entrer"]}[L];
if(T){t1.textContent=T[0];t2.textContent=T[1];go.textContent=T[2]}
const clean=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
code.oninput=()=>code.value=clean(code.value);
code.onkeydown=e=>{if(e.key==="Enter")go.click()};
go.onclick=()=>{const c=clean(code.value);if(c.length<4){code.focus();return}location.href="remote.html?room="+c+(["en","fr"].includes(L)?"&lang="+L:"")};
</script></body></html>
