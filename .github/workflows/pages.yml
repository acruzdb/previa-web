# Publica esta carpeta en https://acruzdb.github.io/previa-web/
name: Publicar web
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: '.' }
      - id: d
        uses: actions/deploy-pages@v4
      - name: Comprobar que la página responde
        run: |
          sleep 20
          for f in "" remote.html relay.js style.css avatars.js remote.js i18n.js; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.d.outputs.page_url }}$f"); echo "$c $f"; [ "$c" = 200 ]
          done
